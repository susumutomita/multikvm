<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MultiKVM latency clock</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        color: #fff;
        font-family: ui-monospace, monospace;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px;
        box-sizing: border-box;
      }
      #clock {
        font-size: 8vw;
        line-height: 1;
      }
      #low {
        font-size: 3vw;
        margin-top: 12px;
      }
      #bar {
        display: flex;
        width: 100%;
        height: 18vh;
      }
      .cell {
        flex: 1 1 0;
        height: 100%;
      }
      .black {
        background: #000;
        outline: 1px solid #333;
      }
      .white {
        background: #fff;
      }
      #note {
        font-size: 1.4vw;
        opacity: 0.8;
      }
      body.flash {
        background: #fff;
      }
      body.flash main {
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <div id="clock">--:--:--.---</div>
        <div id="low">low20 --</div>
      </div>
      <div id="bar"></div>
      <p id="note">
        クリックで全画面。F12 で約 500 ms 白くなります。バーは Swift の LatencyBarcode と同じ 24 セルです。
      </p>
    </main>
    <script>
      const bar = document.getElementById("bar");
      const cells = [];
      for (let index = 0; index < 24; index += 1) {
        const cell = document.createElement("div");
        cell.className = "cell black";
        bar.appendChild(cell);
        cells.push(cell);
      }

      function barcode(unixMilliseconds) {
        const value = BigInt(unixMilliseconds) & 0xfffffn;
        const bits = [];
        for (let shift = 19; shift >= 0; shift -= 1) {
          bits.push(((value >> BigInt(shift)) & 1n) === 1n);
        }
        const parity = bits.reduce((accumulator, bit) => accumulator !== bit, false);
        return [true, false].concat(bits, [parity, false]);
      }

      function paint(now) {
        const date = new Date(now);
        const pad = (value, width) => String(value).padStart(width, "0");
        const clock = document.getElementById("clock");
        const hours = pad(date.getHours(), 2);
        const minutes = pad(date.getMinutes(), 2);
        const seconds = pad(date.getSeconds(), 2);
        const millis = pad(date.getMilliseconds(), 3);
        clock.textContent = `${hours}:${minutes}:${seconds}.${millis}`;
        const low = Number(BigInt(now) & 0xfffffn);
        document.getElementById("low").textContent = `low20 ${low}`;
        const pattern = barcode(now);
        for (let index = 0; index < pattern.length; index += 1) {
          cells[index].className = pattern[index] ? "cell black" : "cell white";
        }
      }

      function tick() {
        if (!document.body.classList.contains("flash")) {
          paint(Date.now());
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);

      let flashTimer = 0;
      function flash() {
        document.body.classList.add("flash");
        window.clearTimeout(flashTimer);
        flashTimer = window.setTimeout(() => {
          document.body.classList.remove("flash");
        }, 500);
      }

      window.addEventListener("keydown", (event) => {
        if (event.key === "F12") {
          event.preventDefault();
          flash();
        }
      });
      document.body.addEventListener("click", () => {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {
            // 全画面を拒否されても時計はそのまま使える。
          });
        }
      });
    </script>
  </body>
</html>
